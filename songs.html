<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest?v=3">
<meta name="theme-color" content="#12344A">
<link rel="icon" href="favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="글렙 노래">
<title>글렙의 노래</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="songs">
<div class="app">
  <section class="stage" id="stage">
    <div class="stage-art">
      <img id="stageArt" src="covers/album.jpg" alt="글렙의 노래 표지">
      <p class="stage-credit" id="stageCredit">작사·작곡 정완(글렙)</p>
    </div>
  </section>
  <div class="list-pane">
    <div class="list-scroll" id="listScroll">
      <div id="songList" class="song-list"></div>
    </div>
    <div class="list-track" id="listTrack" aria-hidden="true"><div class="list-thumb" id="listThumb"></div></div>
  </div>
  <div class="dock" id="dock">
  <div class="dock-inner">
    <div class="dock-row">
      <img class="dock-art" id="dockArt" alt="">
      <p class="dock-title" id="dockTitle"></p>
    </div>
    <p class="playall-status" id="playAllStatus" aria-live="polite"></p>
    <label class="times"><span id="timeNow">0:00</span><span id="timeTotal">0:00</span></label>
    <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치">
    <div class="transport">
      <button type="button" id="playPrev">이전</button>
      <button type="button" id="playPause">일시정지</button>
      <button type="button" id="playNext">다음</button>
      <button type="button" id="playAll" aria-pressed="false"><span id="playAllLabel">연속 듣기</span></button>
    </div>
  </div>
</div>
</div>
<audio id="player" preload="auto" playsinline></audio>
<script src="songs.js"></script>
<script>
const root = document.getElementById("songList");
const player = document.getElementById("player");
const playAll = document.getElementById("playAll");
const playAllLabel = document.getElementById("playAllLabel");
const playAllStatus = document.getElementById("playAllStatus");
const playPrev = document.getElementById("playPrev");
const playNext = document.getElementById("playNext");
const songs = (typeof SONGS !== "undefined" && Array.isArray(SONGS)) ? SONGS : [];
const FADE_MS = 900;
const GAP_MS = 3000;
const cards = [];
let playlist = false;
let cursor = -1;
let phase = "idle";
let fadeFrame = 0;
let gapTimer = 0;
let userPaused = false;

function pageHidden() {
  return document.hidden || document.visibilityState === "hidden";
}

function clearGapTimer() {
  if (gapTimer) {
    clearTimeout(gapTimer);
    gapTimer = 0;
  }
}

const listScroll = document.getElementById("listScroll");
const listTrack = document.getElementById("listTrack");
const listThumb = document.getElementById("listThumb");
let thumbDrag = null;

function revealRow(card) {
  const pane = listScroll.getBoundingClientRect();
  const row = card.getBoundingClientRect();
  if (row.top < pane.top) listScroll.scrollTop -= pane.top - row.top;
  else if (row.bottom > pane.bottom) listScroll.scrollTop += row.bottom - pane.bottom;
  updateListThumb();
}

function updateListThumb() {
  const trackH = listTrack.clientHeight;
  const scrollH = listScroll.scrollHeight;
  const viewH = listScroll.clientHeight;
  if (trackH <= 0) return;
  if (scrollH <= viewH + 1) {
    listThumb.style.height = trackH + "px";
    listThumb.style.transform = "translateY(0)";
    return;
  }
  const thumbH = Math.max(22, Math.round(trackH * viewH / scrollH));
  const maxTop = Math.max(0, trackH - thumbH);
  const top = maxTop * (listScroll.scrollTop / (scrollH - viewH));
  listThumb.style.height = thumbH + "px";
  listThumb.style.transform = "translateY(" + top + "px)";
}

function queueThumb() {
  requestAnimationFrame(updateListThumb);
}

function scrollFromPointer(e) {
  const track = listTrack.getBoundingClientRect();
  const thumbH = listThumb.getBoundingClientRect().height;
  const maxTop = Math.max(1, track.height - thumbH);
  const y = e.clientY - track.top - thumbDrag.offset;
  const ratio = Math.min(1, Math.max(0, y / maxTop));
  listScroll.scrollTop = ratio * (listScroll.scrollHeight - listScroll.clientHeight);
}

listScroll.addEventListener("scroll", updateListThumb, { passive: true });
window.addEventListener("resize", updateListThumb);
if (window.ResizeObserver) new ResizeObserver(updateListThumb).observe(listScroll);
listTrack.addEventListener("pointerdown", (e) => {
  const thumb = listThumb.getBoundingClientRect();
  const onThumb = e.clientY >= thumb.top && e.clientY <= thumb.bottom;
  thumbDrag = { offset: onThumb ? e.clientY - thumb.top : thumb.height / 2 };
  listTrack.setPointerCapture(e.pointerId);
  scrollFromPointer(e);
});
listTrack.addEventListener("pointermove", (e) => {
  if (thumbDrag) scrollFromPointer(e);
});
listTrack.addEventListener("pointerup", () => { thumbDrag = null; });
listTrack.addEventListener("pointercancel", () => { thumbDrag = null; });

function showCover(card) {
  const art = document.getElementById("stageArt");
  const dockArt = document.getElementById("dockArt");
  if (!card) {
    document.body.classList.remove("playing");
    if (art.getAttribute("src") !== "covers/album.jpg") art.src = "covers/album.jpg";
    art.alt = "글렙의 노래 표지";
    dockArt.removeAttribute("src");
    document.getElementById("dockTitle").textContent = "";
    document.getElementById("stageCredit").textContent = (typeof DEFAULT_CREDIT === "string" && DEFAULT_CREDIT) ? DEFAULT_CREDIT : "작사·작곡 정완(글렙)";
    queueThumb();
    return;
  }
  document.body.classList.add("playing");
  if (art.getAttribute("src") !== card.dataset.cover) {
    art.src = card.dataset.cover;
    dockArt.src = card.dataset.cover;
  }
  art.alt = card.dataset.title + " 표지";
  dockArt.alt = "";
  document.getElementById("dockTitle").textContent = card.dataset.title;
  document.getElementById("stageCredit").textContent = card.dataset.credit || "";
  queueThumb();
}

function setCurrent(card) {
  cards.forEach((item) => {
    const on = item === card;
    item.classList.toggle("current", on);
    const cue = item.querySelector(".song-cue");
    cue.textContent = on ? "❚❚" : "▶";
    if (on) item.setAttribute("aria-current", "true");
    else item.removeAttribute("aria-current");
  });
  showCover(card);
}

function updateTransport() {
  const pauseBtn = document.getElementById("playPause");
  if (pauseBtn) pauseBtn.textContent = player.paused ? "재생" : "일시정지";
  if (!playlist || cursor < 0) {
    playAllLabel.textContent = "연속 듣기";
    playAll.setAttribute("aria-pressed", "false");
    if (cursor < 0 && playAllStatus.textContent !== "끝까지 들었습니다") playAllStatus.textContent = "";
    playPrev.disabled = true;
    playNext.disabled = true;
    return;
  }
  playAllLabel.textContent = "정지";
  playAll.setAttribute("aria-pressed", "true");
  playAllStatus.textContent = phase === "gap" ? "쉬는 중" : "";
  playPrev.disabled = cursor <= 0;
  playNext.disabled = cursor >= cards.length - 1;
}

function artworkUrl(path) {
  return new URL(path, location.href).href;
}

function updateSession() {
  if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
  const card = cursor >= 0 ? cards[cursor] : null;
  if (!card) {
    navigator.mediaSession.metadata = null;
    navigator.mediaSession.playbackState = "none";
    return;
  }
  navigator.mediaSession.metadata = new MediaMetadata({
    title: card.dataset.title,
    artist: "정완(글렙)",
    album: "글렙의 노래",
    artwork: [
      { src: artworkUrl(card.dataset.cover), sizes: "1024x1024", type: "image/jpeg" },
    ],
  });
  navigator.mediaSession.playbackState = player.paused ? "paused" : "playing";
  if (phase === "song" && Number.isFinite(player.duration) && player.duration > 0) {
    try {
      navigator.mediaSession.setPositionState({
        duration: player.duration,
        playbackRate: player.playbackRate || 1,
        position: Math.min(player.currentTime || 0, player.duration),
      });
    } catch (e) {}
  }
}

function fadeIn() {
  cancelAnimationFrame(fadeFrame);
  player.volume = 1;
  if (pageHidden()) return;
  const start = performance.now();
  const step = (now) => {
    if (pageHidden()) {
      player.volume = 1;
      return;
    }
    const t = (now - start) / FADE_MS;
    if (!(t >= 0) || t >= 1) {
      player.volume = 1;
      return;
    }
    player.volume = t;
    fadeFrame = requestAnimationFrame(step);
  };
  fadeFrame = requestAnimationFrame(step);
}

function stopPlayback() {
  clearGapTimer();
  cancelAnimationFrame(fadeFrame);
  phase = "idle";
  playlist = false;
  cursor = -1;
  player.pause();
  player.removeAttribute("src");
  setCurrent(null);
  updateTransport();
  updateSession();
}

function finishPlaylist() {
  clearGapTimer();
  cancelAnimationFrame(fadeFrame);
  phase = "idle";
  playlist = false;
  player.pause();
  player.removeAttribute("src");
  setCurrent(null);
  playAllLabel.textContent = "연속 듣기";
  playAll.setAttribute("aria-pressed", "false");
  playAllStatus.textContent = "끝까지 들었습니다";
  playPrev.disabled = true;
  playNext.disabled = true;
  cursor = -1;
  updateSession();
}

function playAudio() {
  const pending = player.play();
  const after = (failed) => {
    updateTransport();
    updateSession();
    if (failed && playlist && cursor >= 0 && cards[cursor]) {
      playAllStatus.textContent = (cursor + 1) + " / " + cards.length + " · " + cards[cursor].dataset.title + " · 재생되지 않았습니다";
    }
  };
  const retry = () => {
    const again = player.play();
    if (again && typeof again.then === "function") {
      again.then(() => after(false)).catch(() => after(true));
    } else {
      after(!again);
    }
  };
  if (pending && typeof pending.then === "function") {
    pending.then(() => after(false)).catch(retry);
  } else {
    after(false);
  }
}

function startSong(index, fade) {
  clearGapTimer();
  if (index < 0 || index >= cards.length) {
    finishPlaylist();
    return;
  }
  playlist = true;
  userPaused = false;
  cursor = index;
  phase = "song";
  cancelAnimationFrame(fadeFrame);
  player.volume = 1;
  player.src = cards[index].dataset.audio;
  playAudio();
  if (fade && !pageHidden()) fadeIn();
  setCurrent(cards[index]);
  updateTransport();
  updateSession();
  if (!pageHidden()) revealRow(cards[index]);
}

function scheduleNext() {
  clearGapTimer();
  if (!playlist || cursor + 1 >= cards.length) {
    finishPlaylist();
    return;
  }
  if (pageHidden()) {
    startSong(cursor + 1, false);
    return;
  }
  phase = "gap";
  updateTransport();
  updateSession();
  gapTimer = setTimeout(() => {
    gapTimer = 0;
    if (phase !== "gap" || !playlist) return;
    startSong(cursor + 1, true);
  }, GAP_MS);
}

player.addEventListener("ended", () => {
  if (phase !== "song") return;
  scheduleNext();
});
document.addEventListener("visibilitychange", () => {
  if (!playlist || phase !== "gap") return;
  clearGapTimer();
  startSong(cursor + 1, !pageHidden());
});
player.addEventListener("play", updateSession);
player.addEventListener("pause", updateSession);
player.addEventListener("timeupdate", () => {
  if (phase === "song") updateSession();
});

if ("mediaSession" in navigator) {
  const bind = (name, fn) => {
    try { navigator.mediaSession.setActionHandler(name, fn); } catch (e) {}
  };
  bind("play", () => {
    userPaused = false;
    playAudio();
  });
  bind("pause", () => {
    userPaused = true;
    player.pause();
    updateSession();
  });
  bind("previoustrack", () => {
    if (cursor > 0) startSong(cursor - 1, false);
    else if (cursor === 0) startSong(0, false);
  });
  bind("nexttrack", () => {
    if (cursor + 1 < cards.length) startSong(cursor + 1, false);
  });
}

if (!songs.length) {
  const empty = document.createElement("p");
  empty.className = "song-empty";
  empty.textContent = "아직 등록된 노래가 없습니다.";
  root.appendChild(empty);
  playAll.disabled = true;
} else {
  let shown = 0;
  songs.forEach((song) => {
    const title = song && song.title ? String(song.title) : "";
    const audio = song && typeof song.audio === "string" ? song.audio.trim() : "";
    const cover = song && typeof song.cover === "string" ? song.cover.trim() : "";
    const duration = song && song.duration ? String(song.duration) : "";
    const credit = (song && song.credit ? String(song.credit) : (typeof DEFAULT_CREDIT === "string" ? DEFAULT_CREDIT : "")).trim();
    if (!title || !audio) return;
    shown += 1;

    const card = document.createElement("article");
    card.className = "song-card";
    card.dataset.audio = audio;
    card.dataset.cover = cover;
    card.dataset.title = title;
    card.dataset.credit = credit;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "song-item";

    const thumb = document.createElement("img");
    thumb.className = "song-thumb";
    thumb.alt = "";
    thumb.src = cover;

    const num = document.createElement("span");
    num.className = "song-num";
    num.textContent = String(shown);

    const name = document.createElement("span");
    name.className = "song-title";
    const nameText = document.createElement("span");
    nameText.className = "song-name";
    nameText.textContent = title;
    name.append(nameText);
    if (credit) {
      const creditEl = document.createElement("span");
      creditEl.className = "song-credit";
      creditEl.textContent = credit;
      name.append(creditEl);
    }
    const live = document.createElement("span");
    live.className = "song-live";
    live.textContent = "재생 중";
    live.hidden = true;
    name.append(live);
    button.append(thumb, num, name);
    if (duration) {
      const dur = document.createElement("span");
      dur.className = "song-dur";
      dur.textContent = duration;
      button.append(dur);
    }
    const cue = document.createElement("span");
    cue.className = "song-cue";
    cue.setAttribute("aria-hidden", "true");
    cue.textContent = "▶";
    button.append(cue);

    button.addEventListener("click", () => {
      const index = cards.indexOf(card);
      if (playlist && cursor === index) {
        stopPlayback();
        return;
      }
      startSong(index, false);
    });

    card.append(button);
    cards.push(card);
    root.appendChild(card);
  });
  if (!cards.length) playAll.disabled = true;
}

playAll.addEventListener("click", () => {
  if (playlist) stopPlayback();
  else startSong(0, false);
});
playPrev.addEventListener("click", () => {
  if (cursor > 0) startSong(cursor - 1, false);
});
playNext.addEventListener("click", () => {
  if (cursor + 1 < cards.length) startSong(cursor + 1, false);
});
const playPause = document.getElementById("playPause");
const seek = document.getElementById("seek");
const timeNow = document.getElementById("timeNow");
const timeTotal = document.getElementById("timeTotal");
let seeking = false;
function fmt(sec) {
  if (!Number.isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}
playPause.addEventListener("click", () => {
  if (cursor < 0) return;
  if (userPaused || (player.paused && phase === "song")) {
    userPaused = false;
    if (phase === "gap") scheduleNext();
    else playAudio();
    return;
  }
  userPaused = true;
  clearGapTimer();
  if (phase === "song") player.pause();
  updateSession();
  updateTransport();
});
seek.addEventListener("pointerdown", () => { seeking = true; });
seek.addEventListener("pointerup", () => { seeking = false; });
seek.addEventListener("change", () => {
  seeking = false;
  if (phase !== "song" || !Number.isFinite(player.duration)) return;
  player.currentTime = (Number(seek.value) / 1000) * player.duration;
});
player.addEventListener("timeupdate", () => {
  if (phase !== "song" || !Number.isFinite(player.duration) || player.duration <= 0) return;
  timeNow.textContent = fmt(player.currentTime);
  timeTotal.textContent = fmt(player.duration);
  if (!seeking) seek.value = String(Math.round((player.currentTime / player.duration) * 1000));
});
queueThumb();
</script>
<script>
if ("serviceWorker" in navigator) {
  var manifest = document.querySelector('link[rel="manifest"]');
  if (manifest) navigator.serviceWorker.register(new URL("sw.js", manifest.href));
}
</script>
</body>
</html>
