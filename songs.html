<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글렙의 노래</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="songs">
<div class="wrap">
  <a class="back" href="index.html">← 홈</a>
  <button type="button" class="playall" id="playAll" aria-pressed="false">
    <span class="playall-mark" aria-hidden="true">♪</span>
    <span id="playAllLabel">전곡 듣기</span>
  </button>
  <h1>글렙의 노래</h1>
  <p class="song-lead">곡을 누르거나 전곡 듣기를 누르면 이 페이지에서 재생됩니다.</p>
  <div class="playall-bar" id="playAllBar" hidden>
    <button type="button" id="playPrev">이전 곡</button>
    <p class="playall-status" id="playAllStatus" aria-live="polite"></p>
    <button type="button" id="playNext">다음 곡</button>
  </div>
  <div id="songList" class="song-list"></div>
</div>
<script src="songs.js"></script>
<script>
const root = document.getElementById("songList");
const playAll = document.getElementById("playAll");
const playAllLabel = document.getElementById("playAllLabel");
const playAllBar = document.getElementById("playAllBar");
const playAllStatus = document.getElementById("playAllStatus");
const playPrev = document.getElementById("playPrev");
const playNext = document.getElementById("playNext");
const songs = (typeof SONGS !== "undefined" && Array.isArray(SONGS)) ? SONGS : [];
// Suno starts ?autoplay=1 about a second after the embed loads, and it does not
// tell this page when a song ends. Wait the listed duration plus this pad.
const ADVANCE_PAD_MS = 2300;
const cards = [];
let playlist = false;
let cursor = -1;
let timer = 0;

function sunoEmbed(url) {
  let parsed;
  try { parsed = new URL(url); } catch (e) { return ""; }
  if (parsed.protocol !== "https:" && parsed.protocol !== "http:") return "";
  const host = parsed.hostname.replace(/^www\./i, "");
  if (host !== "suno.com") return "";
  const parts = parsed.pathname.split("/").filter(Boolean);
  const key = parts.findIndex((part) => part === "song" || part === "embed");
  const id = key >= 0 ? parts[key + 1] : "";
  if (!id || !/^[A-Za-z0-9-]+$/.test(id)) return "";
  return "https://suno.com/embed/" + id;
}

function parseDuration(value) {
  const parts = String(value || "").trim().split(":");
  if (!parts.length || parts.some((part) => !/^\d+$/.test(part))) return 0;
  const nums = parts.map((part) => Number(part));
  if (nums.length === 2) return nums[0] * 60 + nums[1];
  if (nums.length === 3) return nums[0] * 3600 + nums[1] * 60 + nums[2];
  return 0;
}

function playSrc(embed) {
  return embed + "?autoplay=1&t=" + Date.now();
}

function clearTimer() {
  clearTimeout(timer);
  timer = 0;
}

function closeCard(card) {
  card.classList.remove("open");
  const button = card.querySelector(".song-item");
  button.setAttribute("aria-expanded", "false");
  card.querySelector(".song-cue").textContent = "▶";
  card.querySelector(".song-panel").hidden = true;
  const frame = card.querySelector("iframe");
  if (frame.getAttribute("src")) frame.src = "about:blank";
}

function openCard(card) {
  cards.forEach((other) => {
    if (other !== card) closeCard(other);
  });
  const frame = card.querySelector("iframe");
  const src = playSrc(card.dataset.embed);
  if (frame.getAttribute("src") !== src) frame.src = src;
  card.classList.add("open");
  card.querySelector(".song-item").setAttribute("aria-expanded", "true");
  card.querySelector(".song-cue").textContent = "접기";
  card.querySelector(".song-panel").hidden = false;
}

function setCurrent(card) {
  cards.forEach((item) => {
    const on = item === card;
    item.classList.toggle("current", on);
    item.querySelector(".song-live").hidden = !on;
    if (on) item.setAttribute("aria-current", "true");
    else item.removeAttribute("aria-current");
  });
}

function updateTransport() {
  if (!playlist) {
    playAllBar.hidden = true;
    playAllLabel.textContent = "전곡 듣기";
    playAll.setAttribute("aria-pressed", "false");
    return;
  }
  const card = cards[cursor];
  playAllBar.hidden = false;
  playAllLabel.textContent = "정지";
  playAll.setAttribute("aria-pressed", "true");
  let text = (cursor + 1) + " / " + cards.length + " · " + card.dataset.title;
  if (!Number(card.dataset.seconds)) text += " · 길이가 없어 직접 넘겨 주세요";
  playAllStatus.textContent = text;
  playPrev.disabled = cursor <= 0;
  playNext.disabled = cursor >= cards.length - 1;
}

function stopPlaylist() {
  playlist = false;
  clearTimer();
  setCurrent(null);
  cards.forEach(closeCard);
  updateTransport();
}

function finishPlaylist() {
  playlist = false;
  clearTimer();
  cursor = cards.length;
  setCurrent(null);
  playAllLabel.textContent = "전곡 듣기";
  playAll.setAttribute("aria-pressed", "false");
  playAllBar.hidden = false;
  playAllStatus.textContent = "끝까지 들었습니다";
  playPrev.disabled = cards.length < 1;
  playNext.disabled = true;
}

function startAt(index) {
  if (!cards.length) return;
  if (index < 0 || index >= cards.length) {
    finishPlaylist();
    return;
  }
  playlist = true;
  cursor = index;
  const card = cards[index];
  openCard(card);
  setCurrent(card);
  clearTimer();
  const seconds = Number(card.dataset.seconds || 0);
  if (seconds > 0) timer = setTimeout(() => startAt(index + 1), seconds * 1000 + ADVANCE_PAD_MS);
  updateTransport();
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  card.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
}

if (!songs.length) {
  const empty = document.createElement("p");
  empty.className = "song-empty";
  empty.textContent = "아직 등록된 노래가 없습니다.";
  root.appendChild(empty);
  playAll.disabled = true;
} else {
  let shown = 0;
  songs.forEach((song) => {
    const title = song && song.title ? String(song.title) : "";
    const url = song && typeof song.url === "string" ? song.url.trim() : "";
    const duration = song && song.duration ? String(song.duration) : "";
    const embed = sunoEmbed(url);
    if (!title || !/^https?:\/\//i.test(url) || !embed) return;
    shown += 1;

    const card = document.createElement("article");
    card.className = "song-card";
    card.dataset.embed = embed;
    card.dataset.title = title;
    card.dataset.seconds = String(parseDuration(duration));

    const button = document.createElement("button");
    button.type = "button";
    button.className = "song-item";
    button.setAttribute("aria-expanded", "false");

    const num = document.createElement("span");
    num.className = "song-num";
    num.textContent = String(shown);

    const name = document.createElement("span");
    name.className = "song-title";
    name.textContent = title;

    const live = document.createElement("span");
    live.className = "song-live";
    live.textContent = "재생 중";
    live.hidden = true;
    name.append(live);

    button.append(num, name);
    if (duration) {
      const dur = document.createElement("span");
      dur.className = "song-dur";
      dur.textContent = duration;
      button.append(dur);
    }
    const cue = document.createElement("span");
    cue.className = "song-cue";
    cue.setAttribute("aria-hidden", "true");
    cue.textContent = "▶";
    button.append(cue);

    const panel = document.createElement("div");
    panel.className = "song-panel";
    panel.hidden = true;
    const wrap = document.createElement("div");
    wrap.className = "song-frame-wrap";
    const frame = document.createElement("iframe");
    frame.className = "song-frame";
    frame.title = title + " 재생";
    frame.setAttribute("loading", "lazy");
    frame.setAttribute("allow", "autoplay; encrypted-media; fullscreen; picture-in-picture");
    frame.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
    wrap.append(frame);
    panel.append(wrap);

    const ext = document.createElement("a");
    ext.className = "song-ext";
    ext.textContent = "Suno에서 열기";
    ext.setAttribute("href", url);
    ext.setAttribute("target", "_blank");
    ext.setAttribute("rel", "noopener");

    button.addEventListener("click", () => {
      const index = cards.indexOf(card);
      if (card.classList.contains("open") && (!playlist || cursor === index)) {
        stopPlaylist();
        return;
      }
      if (playlist) startAt(index);
      else openCard(card);
    });

    card.append(button, panel, ext);
    cards.push(card);
    root.appendChild(card);
  });
  if (!cards.length) playAll.disabled = true;
}

playAll.addEventListener("click", () => {
  if (playlist) stopPlaylist();
  else startAt(0);
});
playPrev.addEventListener("click", () => {
  if (!cards.length) return;
  startAt(playlist ? cursor - 1 : cards.length - 1);
});
playNext.addEventListener("click", () => {
  if (cursor < cards.length - 1) startAt(cursor + 1);
});
</script>
</body>
</html>
